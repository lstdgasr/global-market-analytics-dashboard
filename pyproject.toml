[project]
name = "global-market-analytics-dashboard"
version = "0.1.0"
description = "A bilingual Streamlit dashboard for comparing global equity index performance and risk."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.36",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

